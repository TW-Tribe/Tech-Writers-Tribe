name: Lint and deploy docs  on:   push:     branches: [main]   pull_request:     branches: [main]  jobs:   lint:     runs-on: ubuntu-latest     steps:       - uses: actions/checkout@v3        - name: Set up Node.js         uses: actions/setup-node@v3         with:           node-version: '18'        - name: Install markdownlint         run: npm install -g markdownlint-cli        - name: Lint all Markdown files         run: markdownlint '**/*.md' --ignore node_modules    deploy:     needs: lint     runs-on: ubuntu-latest     if: github.ref == 'refs/heads/main'     steps:       - uses: actions/checkout@v3       - name: Deploy to GitHub Pages         uses: peaceiris/actions-gh-pages@v3         with:           github_token: ${{ secrets.GITHUB_TOKEN }}           publish_dir: ./